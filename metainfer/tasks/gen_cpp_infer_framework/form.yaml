# Question bank for the `gen-cpp-infer-framework` task type.
# Add or edit entries freely; the skill loader just iterates this list.
# Notes:
#   - options: omit for free-form text questions
#   - The harness auto-appends an "Other" option; do not add it yourself.
#   - header: <= 12 chars

- key: target_model
  question: "Enter the model weight path (path on your storage, not model name on hugging face):"
  header: "Target model path"
  required: true
  form: file

- key: weight_format
  question: "Select the stored weight format; auto-detection uses the model path."
  header: "Weights"
  required: false
  multi: false
  default: "Auto-detect from model path"
  options:
    - label: "Auto-detect from model path"
      description: "Infer F16 or Q8_0 from the filename; an ambiguous directory/path is rejected"
    - label: "F16 GGUF"
      description: "Non-quantized FP16 GGUF"
    - label: "BF16 GGUF"
      description: "Reserved for a future Loader/Backend contract; currently rejected before task start"
    - label: "Q8_0 GGUF"
      description: "8-bit block-quantized GGUF"
    - label: "Other GGUF"
      description: "Reserved for future tensor formats; currently rejected before task start"


- key: target_hardware
  question: "Which GPU platform is the primary target?"
  header: "Hardware"
  required: true
  multi: false
  options:
    - label: "Hygon Z200"
      description: "Initial validation target"

- key: cpp_standard
  question: "Which C++ standard should the generated framework target?"
  header: "C++ std"
  required: false
  multi: false
  default: "C++17"
  options:
    - label: "C++17"
      description: "Portable baseline"
    - label: "C++20"
      description: "Use newer language/library features if available"

- key: build_constraints
  question: "Any build or dependency constraints for the C++ implementation?"
  header: "Build"
  required: false
  default: "Use CMake; no network downloads; prefer system libraries or small self-contained code."

- key: features
  question: "Which optional runtime features must the C++ framework support?"
  header: "Optional"
  required: false
  multi: true
  options:
    - label: "Paged KV cache"
      description: "Block-based KV management"
    - label: "Continuous batching"
      description: "In-flight request scheduling"
    - label: "Tensor parallelism"
      description: "Multi-GPU TP"

- key: max_context_length
  question: "Maximum supported context length in tokens; validated by this task's requirement compiler."
  header: "Context"
  required: false
  form: number
  default: 4096

- key: kv_block_size
  question: "Paged KV block size in tokens; used only when Paged KV cache is selected."
  header: "KV block"
  required: false
  form: number
  default: 16

- key: kv_capacity_policy
  question: "Choose whether every active request is guaranteed the full context or all requests share one KV token budget; used only when Paged KV cache is selected."
  header: "KV capacity"
  required: false
  multi: false
  default: "Full context per request"
  options:
    - label: "Full context per request"
      description: "Provision enough KV blocks for every active request to reach the configured context limit"
    - label: "Shared token budget"
      description: "All active requests share the configured total cached-token budget"

- key: max_total_cached_tokens
  question: "Total cached-token budget across active requests; used only with Paged KV cache and Shared token budget. Use 0 to match one full context."
  header: "KV tokens"
  required: false
  form: number
  default: 0

- key: max_concurrency
  question: "Maximum in-flight requests; used only when Continuous batching is selected."
  header: "Concurrency"
  required: false
  form: number
  default: 4

- key: tp_size
  question: "Number of ranks and GPUs; used only when Tensor parallelism is selected, and the current validated implementation requires exactly 2."
  header: "TP size"
  required: false
  form: number
  default: 2

- key: max_iterations
  question: "Max orchestrator iterations to allow (each iteration = plan/implement/test/optimize)?"
  header: "Max iters"
  required: false
  multi: false
  default: "20"
  options:
    - label: "6"
      description: "Short regression run for a previously validated capability set"
    - label: "10"
      description: "Quick prototype"
    - label: "20"
      description: "Balanced (recommended)"
    - label: "50"
      description: "Long-running, multi-day"

- key: extra_notes
  question: "Any extra C++ constraints or notes (free text)?"
  header: "Notes"
  required: false
