schema_version: 2
name: deepseek-w8a8-gemm-tp4-tp8

public_contract:
  operation: "Y_bf16 = bf16((A_int8 @ W_int8) * A_scale[:, None] * W_scale[None, :])"
  logical_api:
    input: "(A_bf16[M,K], W_int8[K,N], W_scale[N], out_dtype=bfloat16)"
    output: "(Y_bf16[M,N], A_int8[M,K], A_scale[M])"
    candidate_scope: "candidate receives the already prepared A_int8/A_scale and produces only Y_bf16"
  scope: "W8A8 GEMM only; activation quantization, weight loading/slicing/concatenation, allocation, and copies are outside the timed region"
  activation_preparation:
    source: "deterministic BF16 A with shape [M,K], generated by the frozen harness"
    quantization: "dynamic per-row/channel-wise symmetric INT8"
    formula: "A_scale[m] = max(abs(A[m,:])) / 127; A_int8 = clamp(round(A / A_scale), -127, 127)"
    timed: false
  dtype:
    a_source: bfloat16
    a: int8
    b: int8
    a_scale: float32
    b_scale: float32
    accumulation: int32
    scaling: float32
    c: bfloat16
  numerics:
    comparison: "full output plus independent CPU INT64 sentinel points"
    atol: 0.001
    rtol: 0.0
  layout:
    a: "row_major contiguous [M,K]"
    b: "row_major contiguous [K,N]"
    c: "row_major contiguous [M,N]"
    a_scale: "contiguous [M]"
    b_scale: "contiguous [N]"
    trans_a: false
    trans_b: false
  abi:
    entrypoint: launch_w8a8_gemm
    signature: "int launch_w8a8_gemm(const int8_t* a, const int8_t* w, const float* a_scale, const float* w_scale, void* y_bf16, int M, int N, int K, void* stream)"
    return_value: "0 on success; non-zero is an evaluation failure"
  weight_bundle:
    format: "directory with info.json and one raw binary per tensor"
    source_layout: "each weight is row-major [K,N]; each scale is float32 [N]"
    tensor_parallel_rank: 0
    note: "The harness validates filenames, dtype, shape, and byte length before loading. All slicing/concatenation is outside timing."

commands:
  correctness:
    argv: ["{artifact_dir}/metainfer_gemm_harness", correctness]
    timeout_s: 7200
  benchmark:
    argv: ["{artifact_dir}/metainfer_gemm_harness", benchmark]
    timeout_s: 7200

cases:
  correctness_include_benchmark: true
  correctness:
    - heldout-wq-b-tp4-m7
    - heldout-wo-b-tp8-m13
    - heldout-shared-gate-up-proj-tp4-m3
    - heldout-shared-down-proj-tp8-m7
  private:
    - heldout-wq-b-tp4-m7
    - heldout-wo-b-tp8-m13
    - heldout-shared-gate-up-proj-tp4-m3
    - heldout-shared-down-proj-tp8-m7
  benchmark:
    matrix:
      m_values: [1, 2, 4, 8, 16, 4096]
      large_m: 4096
      small_m_total_weight: 0.5
      large_m_weight: 0.5
      # Every requested M is protected from >3% regression. This prevents a
      # large-M win from hiding a decode regression (or vice versa).
      critical_m: [1, 2, 4, 8, 16, 4096]
      workloads:
        - {id: wqkv-a-tp4, op: wqkv_a, tp: 4, k: 4096, n: 1536}
        - {id: wq-b-tp4, op: wq_b, tp: 4, k: 1024, n: 8192}
        - {id: wo-b-tp4, op: wo_b, tp: 4, k: 2048, n: 4096}
        - {id: shared-gate-up-proj-tp4, op: shared_gate_up_proj, tp: 4, k: 4096, n: 1024}
        - {id: shared-down-proj-tp4, op: shared_down_proj, tp: 4, k: 512, n: 4096}
        - {id: wqkv-a-tp8, op: wqkv_a, tp: 8, k: 4096, n: 1536}
        - {id: wq-b-tp8, op: wq_b, tp: 8, k: 1024, n: 4096}
        - {id: wo-b-tp8, op: wo_b, tp: 8, k: 1024, n: 4096}
        - {id: shared-gate-up-proj-tp8, op: shared_gate_up_proj, tp: 8, k: 4096, n: 512}
        - {id: shared-down-proj-tp8, op: shared_down_proj, tp: 8, k: 256, n: 4096}

benchmark_protocol:
  warmup: 10
  samples: 100
  timer: gpu_event
  statistic: median
  synchronization: event_per_sample
  timed_scope: launch_w8a8_gemm_only

acceptance:
  min_weighted_speedup: 1.01
  noise_threshold: 0.01
  max_critical_regression: 0.03
  require_all_cases: true
