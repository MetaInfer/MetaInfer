# Question bank for the `calc-theoretical-value` task type.
#
# This task computes theoretical FLOPs and memory-traffic for a single
# forward pass of an LLM, given the model files and an inference
# framework source tree. It does NOT modify user code or model configs.
#
# Notes:
#   - "file" form types are text inputs that hold absolute paths; the
#     orchestrator treats them as read-only.
#   - env_vars is a textarea with one KEY=VALUE per line.

- key: model_dir
  question: "Path to the model directory (must contain config.json + weight files):"
  header: "Model dir"
  required: true
  form: file

- key: framework_source_dir
  question: "Path to the inference framework source tree (read-only):"
  header: "Framework src"
  required: true
  form: file

- key: cmdline_args
  question: "Command-line arguments used to launch the framework (e.g. --tensor-parallel-size 2 --max-model-len 8192):"
  header: "CLI args"
  required: false
  form: text

- key: env_vars
  question: "Environment variables at launch (one KEY=VALUE per line, e.g. CUDA_VISIBLE_DEVICES=0):"
  header: "Env vars"
  required: false
  form: textarea

- key: token_budget_max_cost_usd
  question: "Token-cost budget cap in USD (optional)? When the running total crosses this limit, the task soft-aborts at the next phase boundary. Leave blank for unlimited."
  header: "Cost cap"
  required: false
  form: number
  default: ""

- key: extra_notes
  question: "Any extra constraints or notes (free text)?"
  header: "Notes"
  required: false
  form: textarea
