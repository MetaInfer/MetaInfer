# Fixed benchmark prompt set for the perf oracle.
#
# This file is IMMUTABLE from the agent's perspective — it lives inside
# the metainfer package, not in iter_dir. Agents cannot game the
# benchmark by editing prompts.
#
# Design principles (different from the correctness oracle's prompts.yaml):
#
# 1. **Larger N** for stable percentiles. The correctness set has 8
#    cases; we have ~40 because p99 stabilization needs N >= 100
#    across the full sweep.
#
# 2. **Varied output length** so generation cost dominates the wall
#    clock (not prompt processing). Each prompt has an explicit
#    `max_tokens` controlling output size.
#
# 3. **Varied prompt length** to exercise both short and long prefill.
#
# 4. **Mix of categories** so a regression specific to (e.g.) long
#    output is visible. Categories enable per-group drill-down in the
#    report.
#
# 5. **Deterministic content** (math, factual recall, fixed translation)
#    so correctness oracle can also judge these if desired. We do NOT
#    judge correctness here — only measure throughput / latency.
#
# Each case has:
#   id            : stable identifier
#   category      : for per-group drill-down
#   prompt        : user-side prompt
#   max_tokens    : output cap (controls generation length)
#   temperature   : always 0 for reproducibility
#
# To extend: add cases here. The oracle iterates the whole list at
# every concurrency level, so more cases = longer benchmark wall time.

# ---- short output (16-32 tokens) ----
